<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f3f0e8" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.svg" />
    <title>个人能力成长库</title>
    <script>
      const showStartupError = (message) => {
        document.body.innerHTML = '<div style="padding:40px;font:16px/1.7 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#1d1d1f"><h1>学习库启动失败</h1><pre style="white-space:pre-wrap;padding:16px;background:#f5f5f7;border-radius:12px;color:#b42318">' + String(message).replace(/[<>&]/g, (character) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[character]) + '</pre></div>'
      }
      window.addEventListener('error', (event) => showStartupError(event.error?.stack || event.message || '未知错误'))
      window.addEventListener('unhandledrejection', (event) => showStartupError(event.reason?.stack || event.reason?.message || String(event.reason)))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
